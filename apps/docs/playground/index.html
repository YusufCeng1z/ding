<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground · Ding</title>
    <meta name="description" content="Try ready-made Ding toast styles, change colors, shape, motion and icon, and copy the CSS and code." />
    <link rel="canonical" href="https://ding.yusufcengiz.dev/playground/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#121211" />
    <script type="module" src="/src/playground.ts"></script>
  </head>
  <body>
    <div class="page">
      <a class="skip" href="#main">Skip to playground</a>
      <header class="bar">
        <nav class="nav" aria-label="Site">
          <a class="navlink" href="/">Demos</a>
          <a class="navlink" href="/docs.html">Docs</a>
          <a class="navlink" href="/playground/" aria-current="page">Playground</a>
          <a class="navlink" href="/changelog/">What's new</a>
          <a class="gh" href="https://github.com/YusufCeng1z/ding" target="_blank" rel="noopener noreferrer" aria-label="Star Ding on GitHub"><svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg><span>Star on GitHub</span></a>
        </nav>
      </header>

      <main id="main" class="playground">
        <div class="hero">
          <h1>Playground</h1>
          <p class="tag">Pick a style, tweak it, copy the code.</p>
        </div>

        <div class="stage" id="stage" role="region" aria-label="Toast preview">
          <button type="button" class="next" id="next">Next toast</button>
        </div>

        <div class="row" id="presets" role="group" aria-label="Ready-made styles"></div>

        <div class="panel">
          <div class="ctl"><label class="lbl" for="radius">Corner radius</label><div class="rad"><input id="radius" type="range" min="0" max="22" value="22" /><output id="radius-out" for="radius">22 px</output></div></div>
          <div class="ctl"><span class="lbl" id="l-size">Size</span><div class="opts" id="size" role="group" aria-labelledby="l-size"></div></div>
          <div class="ctl"><span class="lbl" id="l-theme">Theme</span><div class="opts" id="theme" role="group" aria-labelledby="l-theme"></div></div>
          <div class="ctl"><span class="lbl" id="l-filled">Surface</span><div class="opts" id="filled" role="group" aria-labelledby="l-filled"></div></div>
          <div class="ctl"><span class="lbl" id="l-motion">Motion</span><div class="opts" id="motion" role="group" aria-labelledby="l-motion"></div></div>
          <div class="ctl"><span class="lbl" id="l-icon">Custom icon</span><div class="opts" id="icon" role="group" aria-labelledby="l-icon"></div></div>
          <div class="ctl"><span class="lbl">Colors</span><div class="swatches" id="colors"></div></div>
        </div>
        <button type="button" class="quiet reset" id="reset">Reset all</button>

        <div class="snippet">
          <pre tabindex="0"><code id="css"></code></pre>
          <button type="button" class="copy" id="copy">Copy</button>
        </div>
        <span class="pg-status" id="status" role="status"></span>
      </main>
    </div>
  </body>
</html>
